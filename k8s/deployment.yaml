apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-api
  template:
    metadata:
      labels:
        app: weather-api
    spec:
      containers:
      - name: weather-api
        image: mdfathi/weatherapizerodowntime:latest
        env:
          - name: APP_VERSION
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: version
        ports:
        - containerPort: 8000
