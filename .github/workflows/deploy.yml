name: CI/CD - Docker Build & Deploy

on:
  release:
    types: [created]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: mdfathi/weatherapizerodowntime

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract release version
      id: get_version
      run: |
        VERSION=${GITHUB_REF##*/}
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Extracted version: $VERSION"

    - name: Build and Push Docker Image
      run: |
        docker build --build-arg APP_VERSION=$VERSION -t $IMAGE_NAME:$VERSION .
        docker push $IMAGE_NAME:$VERSION

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          export APP_VERSION=$VERSION
          cd /home/ubuntu/weather-api
          echo "APP_VERSION=$APP_VERSION" > .env
          docker-compose pull
          docker-compose up -d --no-deps --build web
          docker system prune -f

    - name: Health Check - /api/hello
      run: |
        sleep 10
        RESPONSE=$(curl -s http://${{ secrets.SERVER_HOST }}/api/hello | jq -r .version)
        echo "API responded with version: $RESPONSE"
        if [ "$RESPONSE" != "$VERSION" ]; then
          echo "Version mismatch! Expected: $VERSION, Got: $RESPONSE"
          exit 1
        else
          echo "Version check passed."
        fi
